<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Workout</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>

    <header>
        <h1>My Smart Workout</h1>
    </header>

    <main>
        <!-- Initial Setup Section -->
<section id="setup-section" class="card">
            <h2>⚙️ My Profile</h2>
            <div class="input-group">
                <input type="number" id="age" placeholder="Age">
                <input type="number" id="weight" placeholder="Weight (kg)">
            </div>
            <select id="goal">
                <option value="strength">Build Strength</option>
                <option value="cardio">Improve Cardio</option>
                <option value="weight_loss">Weight Loss</option>
            </select>
            <select id="frequency">
                <option value="2">Train 2 Days/Week</option>
                <option value="4">Train 4 Days/Week</option>
                <option value="6">Train 6 Days/Week</option>
            </select>

            <!-- NEW EQUIPMENT SECTION -->
            <h3 style="margin-top: 15px; font-size: 1rem; color: #4776E6;">My Equipment:</h3>
            <div class="checkbox-group">
                <label><input type="checkbox" id="eq-treadmill"> Treadmill / Garden (Walk/Jog)</label>
                <label><input type="checkbox" id="eq-bike"> Indoor Bike</label>
                <label><input type="checkbox" id="eq-mat"> Yoga Mat (Floor/Core work)</label>
                <label><input type="checkbox" id="eq-machine"> Weights Machine</label>
                <label><input type="checkbox" id="eq-squat"> Squat Rack / Free Weights</label>
            </div>

            <button id="save-profile" class="primary-btn">Save Profile</button>
        </section>
        </section>

        <hr>

        <!-- Daily Input Section -->
        <section id="daily-section">
            <h2>Today's Session</h2>
            <label for="time-available">Time Available (mins):</label>
            <input type="number" id="time-available" placeholder="e.g., 45"><br><br>

            <button id="dictate-btn">🎤 Dictate Update</button>
            <p id="dictation-output"><em>Voice input will appear here...</em></p>

            <button id="get-workout-btn">Get Suggested Workout</button>
        </section>

        <!-- Output Section -->
        <section id="workout-plan">
            <h3>Your Plan:</h3>
            <p id="suggested-routine">Fill in your details to get a workout.</p>
        </section>
    </main>

   <script src="app.js"></script>
</body>
</html>
