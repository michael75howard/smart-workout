<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smart Workout</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="https://www.w3.org/TR/appmanifest/images/icon-192.png">
</head>
<body>
    <header>
        <h1>Smart Workout</h1>
    </header>

    <main>
        <section id="setup-section" class="card">
            <h2>⚙️ My Profile</h2>
            <div class="input-group">
                <input type="number" id="age" placeholder="Age">
                <input type="number" id="weight" placeholder="Weight (kg)">
            </div>
            <select id="goal">
                <option value="strength">Build Strength</option>
                <option value="cardio">Improve Cardio</option>
                <option value="weight_loss">Weight Loss</option>
            </select>
            <select id="frequency">
                <option value="2">Train 2 Days/Week</option>
                <option value="4">Train 4 Days/Week</option>
                <option value="6">Train 6 Days/Week</option>
            </select>

            <!-- EQUIPMENT SECTION -->
            <h3 style="margin-top: 15px; font-size: 1rem; color: #4776E6;">My Equipment:</h3>
            <div class="checkbox-group">
                <label><input type="checkbox" id="eq-treadmill"> Treadmill / Garden (Walk/Jog)</label>
                <label><input type="checkbox" id="eq-bike"> Indoor Bike</label>
                <label><input type="checkbox" id="eq-mat"> Yoga Mat (Floor/Core work)</label>
                <label><input type="checkbox" id="eq-machine"> Weights Machine</label>
                <label><input type="checkbox" id="eq-squat"> Squat Rack / Free Weights</label>
            </div>

            <button id="save-profile" class="primary-btn">Save Profile</button>
        </section>

        <section id="daily-section" class="card">
            <h2>🏃 Today's Session</h2>
            <input type="number" id="time-available" placeholder="Time Available (mins)">
            <button id="get-workout-btn" class="primary-btn">Generate Plan</button>
            
            <div id="workout-plan" class="hidden">
                <h3>Your Plan:</h3>
                <p id="suggested-routine"></p>
                
                <hr>
                
                <h3>Log Results:</h3>
                <button id="dictate-btn" class="voice-btn">🎤 Dictate Workout Data</button>
                <p id="dictation-output"></p>
                <button id="finish-workout-btn" class="success-btn hidden">Finish & Save</button>
            </div>
        </section>

        <section id="history-section" class="card">
            <h2>📅 Workout History</h2>
            <div id="history-list"></div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
